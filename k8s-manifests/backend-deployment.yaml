apiVersion: apps/v1
kind: Deployment
metadata:
  name: node-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: node-backend
  template:
    metadata:
      labels:
        app: node-backend
    spec:
      containers:
      - name: node-backend
        image: YOUR_DOCKERHUB_USERNAME/node-backend:latest
        ports:
        - containerPort: 8080
        env:
        - name: DB_HOST
          value: mysql-service
        - name: DB_NAME
          value: avvak
        - name: DB_USER
          value: root
        - name: DB_PASS
          value: root
        - name: DB_PORT
          value: "3307"
        - name: PORT
          value: "8080"
---
apiVersion: v1
kind: Service
metadata:
  name: node-backend-service
spec:
  type: ClusterIP
  selector:
    app: node-backend
  ports:
  - protocol: TCP
    port: 8080
    targetPort: 8080