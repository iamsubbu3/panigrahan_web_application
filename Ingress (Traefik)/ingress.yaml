apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: panigrahan-ingress
  namespace: panigrahan

  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    traefik.ingress.kubernetes.io/router.entrypoints: websecure

spec:

  tls:
  - hosts:
    - YOUR_DOMAIN_NAME

    secretName: panigrahan-tls

  rules:

  - host: YOUR_DOMAIN_NAME

    http:
      paths:

      - path: /
        pathType: Prefix

        backend:
          service:
            name: frontend-service

            port:
              number: 80

      - path: /api
        pathType: Prefix

        backend:
          service:
            name: backend-service

            port:
              number: 8080  