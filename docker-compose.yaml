version: '3.9'

services:

  # ===================================================== 
  # MYSQL DATABASE                                        
  # ===================================================== 

  mysql:
  
    image: mysql:8

    container_name: mysql-container

    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: avvak

    command: --port=3307

    ports:
      - "3307:3307"

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - panigrahan-network

  # ===================================================== 
  # BACKEND NODE.JS                                       
  # ===================================================== 

  backend:

    build:
      context: ./server

    container_name: node-backend

    restart: always

    depends_on:
      - mysql

    environment:
      DB_HOST: mysql
      DB_NAME: avvak
      DB_USER: root
      DB_PASS: root
      DB_PORT: 3307
      PORT: 8080

    ports:
      - "8080:8080"

    networks:
      - panigrahan-network

  # ===================================================== 
  # FRONTEND REACT                                        
  # ===================================================== 

  frontend:

    build:
      context: ./client

    container_name: react-frontend

    restart: always

    depends_on:
      - backend

    ports:
      - "80:80"

    networks:
      - panigrahan-network

# ===================================================== 
# VOLUMES                                               
# ===================================================== 

volumes:

  mysql-data:

# ===================================================== 
# NETWORKS                                              
# ===================================================== 

networks:

  panigrahan-network: